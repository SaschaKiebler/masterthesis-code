# Evaluation defaults — override for anything beyond a throwaway evaluation
# cluster, e.g.:
#   kubectl -n heating-platform create secret generic platform-secrets \
#     --from-literal=DB_PASSWORD=... --from-literal=LOCAL_AUTH_JWT_SECRET=... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  DB_PASSWORD: password
  LOCAL_AUTH_JWT_SECRET: insecure-local-dev-secret-change-me
