# Rust ingestion: MQTT in, TimescaleDB + measurement.ingested out.
# No HTTP surface, hence no probes; it blocks at startup until it has
# replayed device.configured (device-management must be up).
#
# Horizontally scalable. Two properties make replicas safe:
#  - every pod connects under its own MQTT client id, derived from the pod
#    name, so the broker no longer kicks the older connection on each connect;
#  - all pods subscribe through the shared-subscription group MQTT_SHARE_GROUP,
#    so Mosquitto hands each message to exactly one pod instead of to all of
#    them. A pod leaving the group (rollout, crash) redistributes its share to
#    the remaining members.
# The device.configured projection is replayed in full by every pod (manual
# assign, no offsets committed), so all replicas gate on identical state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
spec:
  replicas: 2
  # maxUnavailable 0 keeps a group member subscribed throughout the rollout,
  # so telemetry keeps flowing instead of pausing as it did under Recreate.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: ingestion-service
          env:
            - name: MQTT_HOST
              value: mosquitto
            # Same group name in every pod; a different name would make that
            # pod an independent reader receiving a full copy of the stream.
            - name: MQTT_SHARE_GROUP
              value: ingestion
            - name: DB_HOST
              value: measurement-db
            # Must be set: the code falls back to 5433, which is the port the
            # local compose stack publishes. In-cluster the service listens on
            # 5432, and a connect to an undefined service port is blackholed
            # rather than refused, so the pod hangs in create_pool and looks
            # healthy while ingesting nothing (no probes on this service).
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: digital_demon_measurements
            # Connection budget. The store runs with max_connections=100 and is
            # shared with analytics and core, so the ingestion tier at its
            # autoscaler ceiling of 10 replicas may claim at most 6 each, i.e.
            # 60. Without this cap deadpool sizes the pool from the node's CPU
            # count, which under a spike exhausted the store's connections and
            # cost 5.65 % of the measurements in QS-PER-02.
            - name: DB_MAX_CONNECTIONS
              value: "6"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
# Elastic scale-out on ingest load. CPU is the usable signal here: the service
# has no HTTP surface to scale on, and parse plus insert work is what a
# telemetry burst turns into. Scaling on MQTT queue depth would need KEDA and
# a broker-side metric Mosquitto does not expose.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 2
  # 10 rather than 6: at 2500 measurements/s the tier sat at 6/6 and 80 % CPU,
  # so its own ceiling was in play and the ingest ceiling could no longer be
  # attributed to the measurement store alone.
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Each new pod replays device.configured before it takes traffic, so scale
    # up in steps rather than doubling on a single spike, and scale down slowly
    # to avoid churning through that replay.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
