# Analytics: the platform's only measurement reader. Serves statistical
# charts and the live endpoints (/stats/latest, /stats/ingest-rate) for the
# frontend Monitor.
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: analytics-service
          ports:
            - containerPort: 8100
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://postgres:$(DB_PASSWORD)@measurement-db:5432/digital_demon_measurements
            - name: REGISTRY_DATABASE_URL
              value: postgresql://postgres:$(DB_PASSWORD)@stammdaten-db:5432/digital_demon
            # Must be the SAME secret core signs with: analytics verifies the
            # caller's token and resolves their tenant from it. Without this it
            # silently fell back to the config default, which happened to match
            # — changing the secret for a real cluster would have made every
            # /stats call 401.
            - name: LOCAL_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: LOCAL_AUTH_JWT_SECRET
            # Tenant authorisation twin of the core's switch; OBSERVE lets the
            # QS-SEC-01 before/after run happen in one cluster session.
            - name: TENANT_ENFORCEMENT
              value: enforce
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
