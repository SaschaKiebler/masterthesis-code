# Master-data store (plain PostgreSQL): ontology, registry, rules, events,
# users. Owned schema-wise by core-platform's Flyway (plus the notification
# service's own history table). Separate from the measurement store per the
# thesis design (ch. 4.4.6).
apiVersion: v1
kind: Service
metadata:
  name: stammdaten-db
spec:
  selector:
    app: stammdaten-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stammdaten-db
spec:
  serviceName: stammdaten-db
  replicas: 1
  selector:
    matchLabels:
      app: stammdaten-db
  template:
    metadata:
      labels:
        app: stammdaten-db
    spec:
      containers:
        - name: stammdaten-db
          image: postgres:16
          args: ["-c", "max_connections=100"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: heating_platform
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            # Subdirectory so the mounted volume's lost+found does not break initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "heating_platform"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
