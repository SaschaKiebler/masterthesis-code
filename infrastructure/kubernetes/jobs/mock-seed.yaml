# Commission the mock fleet in the platform DB (one-shot).
# Adjust --sites/--rooms and the image, then:
#   kubectl apply -f mock-seed.yaml && kubectl -n heating-platform logs -f job/mock-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: mock-seed
  namespace: heating-platform
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mock-seed
          image: europe-west3-docker.pkg.dev/heating-platform-eval/heating-platform/mock-service:latest
          args:
            - seed
            - --sites=10
            - --rooms=3
            - --dsn=postgresql://postgres:$(DB_PASSWORD)@timescaledb:5432/digital_demon
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
