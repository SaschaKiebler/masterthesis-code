# Commission the mock fleet in the platform DB (one-shot).
# Adjust --sites/--rooms and the image, then:
#   kubectl apply -f mock-seed.yaml && kubectl -n heating-platform logs -f job/mock-seed
#
# Sized for the load scenarios of thesis ch. 6: 25 sites x (1 boiler + 3 room
# sensors) = 100 devices, which is what QS-PER-01 specifies. Per publish
# interval that fleet emits 175 messages carrying 250 measurements (boiler one
# message with four metrics, each H&T two messages with one metric; the battery
# metric only fires every tenth tick and is ignored here). The external
# `mock-service run` must be given the SAME --prefix/--sites/--rooms, and picks
# the rate through --interval:
#   QS-PER-01,   500 measurements/s  ->  --interval=0.5
#   QS-PER-02, 2.500 measurements/s  ->  --interval=0.1
#
# The prefix is `tenanta` and not `mock`, because the tenant id is derived from
# it. That puts the fleet under measurement into the same tenant as the probe
# user QS-PER-03 logs in with, so the query load runs THROUGH tenant
# enforcement rather than past it as a system admin would.
apiVersion: batch/v1
kind: Job
metadata:
  name: mock-seed
  namespace: heating-platform
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mock-seed
          image: europe-west3-docker.pkg.dev/heating-platform-eval/heating-platform/mock-service:latest
          args:
            - seed
            - --prefix=tenanta
            - --sites=25
            - --rooms=3
            - --dsn=postgresql://postgres:$(DB_PASSWORD)@stammdaten-db:5432/digital_demon
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
