# Remote image build (no local Docker needed), native amd64.
# Usage, from the repo root:
#   gcloud builds submit . --config infrastructure/cloudbuild.yaml \
#     --project heating-platform-eval --substitutions _SERVICE=frontend
# Source upload is trimmed by .gcloudignore. Regional builds gave
# PERMISSION_DENIED on this project; use the default (global) pool.
substitutions:
  _SERVICE: frontend
  _REGISTRY: europe-west3-docker.pkg.dev/heating-platform-eval/heating-platform
  # Docker build context. Most services build from the repo root because their
  # Dockerfiles copy apis/ and applications/<svc>/. mock-service and the locust
  # load generator copy paths relative to their OWN directory and therefore need
  # _CONTEXT set to that directory.
  _CONTEXT: '.'
  # Dockerfile path, relative to the repo root. Not every image lives under
  # applications/, the query-API load generator sits in evaluation/load.
  _DOCKERFILE: applications/frontend/Dockerfile
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - ${_DOCKERFILE}
      - '-t'
      - ${_REGISTRY}/${_SERVICE}:latest
      - ${_CONTEXT}
images:
  - ${_REGISTRY}/${_SERVICE}:latest
