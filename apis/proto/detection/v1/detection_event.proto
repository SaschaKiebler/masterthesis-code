// Shared envelope for all detection events, per docs/architecture/event-catalog.md:
// detection fans in from many detectors, notification fans out to channels.
//
// Topics carrying this envelope (all keyed by device_id):
//   threshold.breached   — analytics evaluator (rule-based, live)
//   anomaly.detected     — analytics weather-context detector (live)
//   maintenance.predicted — analytics family (later)
//
// The notification service treats every detection event uniformly; adding a
// detector never touches notification, and changing notification policy never
// touches a detector.

syntax = "proto3";

package detection.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.heatingplatform.detection.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "DetectionEventProto";

message DetectionEvent {
  // Detector kind, equals the topic name (e.g. "threshold.breached").
  string type = 1;

  // INFO | WARNING | ERROR | CRITICAL (matches core's events severity).
  string severity = 2;

  Channel channel = 3;

  // Opaque reference for routing back to the asset: the metric_point id.
  string asset_ref = 4;

  google.protobuf.Timestamp detected_at = 5;

  // Detector-specific payload as raw JSON
  // (e.g. {"value":..,"threshold":..,"operator":..}).
  string detail = 6;

  // Tenant owning the affected asset (UUID string). Lets consumers apply
  // tenant-scoped policy without a registry lookup.
  string tenant_id = 7;

  // Human-readable one-line finding, produced by the detector.
  string summary = 8;
}

// The measurement channel the detection fired on.
message Channel {
  string device_id = 1;
  int32 metric_id = 2;
}
