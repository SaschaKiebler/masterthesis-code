spring:
  application:
    name: device-management

  # Shared platform database: device-management reads the device-config
  # projection (physical_devices, metric_points, objects). Schema is owned
  # and migrated by core-platform.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:heating_platform}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: device-management
    # The NewTopic beans of this service are only applied once, at startup.
    # Without fail-fast a broker that is not up yet leaves the topics
    # uncreated and the service then produces into the void for the rest of
    # its life (auto-creation is off by design). Failing the context instead
    # makes the pod restart until Kafka is there, which is the convergence
    # model the rest of the platform already relies on.
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8082

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: device-management
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  enabled: ${MQTT_ENABLED:true}

device-management:
  topics:
    device-configured: device.configured
    device-discovered: device.discovered
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
  projection:
    # How often the config projection is reconciled against the database.
    sweep-interval-ms: ${PROJECTION_SWEEP_INTERVAL_MS:30000}
  watcher:
    # Re-announce an unconfigured device at most once per this window.
    discovered-throttle-minutes: ${WATCHER_THROTTLE_MINUTES:10}
    sample-payload-max-chars: 512
  discovery:
    enabled: true
    max-sessions-per-tenant: 3
    session-timeout-seconds: 300
    max-messages-per-session: 500

logging:
  level:
    com.heatingplatform: INFO
