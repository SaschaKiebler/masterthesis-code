[package]
name = "ingestion-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MQTT client
rumqttc = "0.24"

# PostgreSQL (async)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = { version = "0.12", features = ["serde"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Hex encoding/decoding
hex = "0.4"

# AES decryption (for wM-Bus)
aes = "0.8"
cbc = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# Protobuf serialization (for MQTT publish to core-platform)
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"
