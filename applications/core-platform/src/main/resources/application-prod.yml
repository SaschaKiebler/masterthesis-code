# Prod profile — strict logging, no SQL output.
# Activate with: SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.digitaldemon: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
