# Dev profile — permits all requests without authentication,
# but still parses local JWTs so user resolution works when a token is sent.
# Activate with: SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.digitaldemon: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# The dev chain permits every request, so local calls carry no token and no
# subject. Tenant authorisation has nothing to decide on and is switched off
# outright rather than relying on the skip-without-subject rule.
tenant:
  enforcement:
    mode: OFF
