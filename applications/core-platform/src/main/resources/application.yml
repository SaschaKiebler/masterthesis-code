spring:
  application:
    name: core-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_demon
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Version 0, not 1. The master-data schema is shared with
    # notification-service, so core cannot assume it migrates an empty
    # database: whichever service starts first fills the schema, and a
    # baseline at 1 would then mark core's own V1 as applied and skip the
    # migration that creates `sites`. Same reasoning as the notification
    # service, which already baselines at 0.
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: true

  # Kafka broker connection (topic names live under the app-level kafka: block)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: core-platform
    # The NewTopic beans of this service are only applied once, at startup.
    # Without fail-fast a broker that is not up yet leaves the topics
    # uncreated and the service then produces into the void for the rest of
    # its life (auto-creation is off by design). Failing the context instead
    # makes the pod restart until Kafka is there, which is the convergence
    # model the rest of the platform already relies on.
    admin:
      fail-fast: true
    consumer:
      group-id: core-platform
      # Only applies when the group has no committed offset yet (first start);
      # afterwards restarts resume from the committed offset.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # Never auto-create subscribed topics; owners provision them.
        allow.auto.create.topics: false
    producer:
      # Producer is only used to publish dead letters (raw consumed bytes)
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8080

# gRPC Server Configuration
grpc:
  server:
    port: 9090
    max-inbound-message-size: 104857600   # 100 MB
  client:
    GLOBAL:
      negotiation-type: PLAINTEXT
      max-inbound-message-size: 104857600 # 100 MB

# Local authentication (self-issued HS256 JWTs, no external identity provider)
local-auth:
  jwt-secret: ${LOCAL_AUTH_JWT_SECRET:insecure-local-dev-secret-change-me}
  token-ttl-hours: ${LOCAL_AUTH_TOKEN_TTL_HOURS:24}
  admin-email: ${LOCAL_AUTH_ADMIN_EMAIL:admin@local}
  admin-password: ${LOCAL_AUTH_ADMIN_PASSWORD:admin}
  admin-display-name: ${LOCAL_AUTH_ADMIN_DISPLAY_NAME:Local Admin}

service-auth:
  n8n:
    enabled: ${N8N_SERVICE_TOKEN_ENABLED:false}
    token: ${N8N_SERVICE_TOKEN:}
    subject: ${N8N_SERVICE_SUBJECT:service:n8n}
    email: ${N8N_SERVICE_EMAIL:n8n@digitaldemon.local}
    display-name: ${N8N_SERVICE_DISPLAY_NAME:n8n Service User}
    global-role: ${N8N_SERVICE_GLOBAL_ROLE:system_admin}

# Event topics and provisioning defaults (see docs/architecture/event-catalog.md)
kafka:
  enabled: ${KAFKA_ENABLED:true}
  topics:
    measurement-ingested: measurement.ingested
    device-discovered: device.discovered
    threshold-breached: threshold.breached
    anomaly-detected: anomaly.detected
    rule-configured: rule.configured
    anomaly-rule-configured: anomaly-rule.configured
  topic-defaults:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

# Device-management service (owns the MQTT broker tap and device topics).
# Core has no broker connection anymore; discovery-session REST is proxied.
device-management:
  url: ${DEVICE_MANAGEMENT_URL:http://localhost:8082}

logging:
  level:
    com.digitaldemon: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# Read-only access to the measurement store, used only by the privacy package
# (GDPR export, QS-SEC-02). Deliberate extra reader on the shared-database
# deviation — see MeasurementReadConfig. Top-level on purpose: NOT part of the
# spring: block.
measurement:
  datasource:
    url: ${MEASUREMENT_DB_URL:jdbc:postgresql://localhost:5433/digital_demon_measurements}
    username: ${MEASUREMENT_DB_USERNAME:postgres}
    password: ${MEASUREMENT_DB_PASSWORD:password}

# Central tenant authorisation (see tenancy/TenantScopeInterceptor).
#   OFF     interceptor does nothing
#   OBSERVE resolve and record, never block — closes the audit blind spot alone
#   ENFORCE resolve, record, refuse foreign resources with 403
# Read per request, so a bad rollout is one env change plus a restart away.
tenant:
  enforcement:
    mode: ${TENANT_ENFORCEMENT_MODE:ENFORCE}
