spring:
  application:
    name: core-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_demon
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    out-of-order: true

  # Kafka broker connection (topic names live under the app-level kafka: block)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: core-platform
    consumer:
      group-id: core-platform
      # Only applies when the group has no committed offset yet (first start);
      # afterwards restarts resume from the committed offset.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # Never auto-create subscribed topics; owners provision them.
        allow.auto.create.topics: false
    producer:
      # Producer is only used to publish dead letters (raw consumed bytes)
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8080

# gRPC Server Configuration
grpc:
  server:
    port: 9090
    max-inbound-message-size: 104857600   # 100 MB
  client:
    GLOBAL:
      negotiation-type: PLAINTEXT
      max-inbound-message-size: 104857600 # 100 MB

# Local authentication (self-issued HS256 JWTs, no external identity provider)
local-auth:
  jwt-secret: ${LOCAL_AUTH_JWT_SECRET:insecure-local-dev-secret-change-me}
  token-ttl-hours: ${LOCAL_AUTH_TOKEN_TTL_HOURS:24}
  admin-email: ${LOCAL_AUTH_ADMIN_EMAIL:admin@local}
  admin-password: ${LOCAL_AUTH_ADMIN_PASSWORD:admin}
  admin-display-name: ${LOCAL_AUTH_ADMIN_DISPLAY_NAME:Local Admin}

service-auth:
  n8n:
    enabled: ${N8N_SERVICE_TOKEN_ENABLED:false}
    token: ${N8N_SERVICE_TOKEN:}
    subject: ${N8N_SERVICE_SUBJECT:service:n8n}
    email: ${N8N_SERVICE_EMAIL:n8n@digitaldemon.local}
    display-name: ${N8N_SERVICE_DISPLAY_NAME:n8n Service User}
    global-role: ${N8N_SERVICE_GLOBAL_ROLE:system_admin}

# Event topics and provisioning defaults (see docs/architecture/event-catalog.md)
kafka:
  enabled: ${KAFKA_ENABLED:true}
  topics:
    measurement-ingested: measurement.ingested
    device-discovered: device.discovered
    threshold-breached: threshold.breached
    anomaly-detected: anomaly.detected
    rule-configured: rule.configured
    anomaly-rule-configured: anomaly-rule.configured
  topic-defaults:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

# Device-management service (owns the MQTT broker tap and device topics).
# Core has no broker connection anymore; discovery-session REST is proxied.
device-management:
  url: ${DEVICE_MANAGEMENT_URL:http://localhost:8082}

logging:
  level:
    com.digitaldemon: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
