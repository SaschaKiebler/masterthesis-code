spring.application.name=core-platform

# ── KPI Formula AI generation (n8n webhook) ────────────────────────────────
kpi-formula.n8n.webhook-url=${N8N_KPI_FORMULA_WEBHOOK_URL:}
kpi-formula.n8n.webhook-token=${N8N_WEBHOOK_TOKEN:}
kpi-formula.n8n.timeout-seconds=60

# ── Template Builder AI generation (n8n webhook) ───────────────────────────
template-builder.n8n.webhook-url=${N8N_WEBHOOK_URL:}
template-builder.n8n.timeout-seconds=120

# ── Dashboard AI Builder (n8n webhook) ─────────────────────────────────────
dashboard-ai.n8n.webhook-url=${N8N_DASHBOARD_AI_WEBHOOK_URL:}
dashboard-ai.n8n.webhook-token=${N8N_WEBHOOK_TOKEN:}
dashboard-ai.n8n.timeout-seconds=180

# ── SVG Icon Generation (n8n webhook) ─────────────────────────────────────
svg-generation.n8n.webhook-url=${N8N_SVG_GENERATION_WEBHOOK_URL:}
svg-generation.n8n.webhook-token=${N8N_WEBHOOK_TOKEN:}
svg-generation.n8n.timeout-seconds=120

# ── Google Cloud Storage (SVG icons for synoptic view) ────────────────────
gcs.bucket-name=${GCS_BUCKET_NAME:}
gcs.project-id=${GCS_PROJECT_ID:}
