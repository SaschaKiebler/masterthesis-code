[project]
name = "mock-service"
version = "0.1.0"
description = "Device-fleet mock: stands in for edge devices by publishing realistic heating telemetry over MQTT, for functional and load evaluation"
authors = [
    {name = "Sascha Kiebler", email = "saschakiebler@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "aiomqtt>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
mock-service = "mock_service.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "mock_service", from = "src" }]
