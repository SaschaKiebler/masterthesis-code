# Local development stack for the heating-monitoring platform.
#
# Matches the services' config defaults, so the services run locally
# without any env overrides (ingestion + analytics point at 5433):
#   Kafka          localhost:9092   (inter-service events, see docs/architecture/event-catalog.md)
#   Kafka UI       localhost:8081
#   Mosquitto      localhost:1883   (edge device transport)
#   stammdaten-db  localhost:5432   (PostgreSQL, db heating_platform, schema via core-platform Flyway)
#   measurement-db localhost:5433   (TimescaleDB, db heating_platform_measurements, schema via init SQL)
#
# Separate stores per the thesis design (ch. 4.4.6): master data in plain
# PostgreSQL, raw measurements in TimescaleDB with analytics as the single
# reader. Switching from the former single instance discards the old
# volumes — reseed once via `scripts/dev.sh down -v` and a fresh `up`.
#
# Usage: docker compose -f docker/docker-compose-kafka.yaml up -d

services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are provisioned exclusively by their owning service's KafkaAdmin.
      # Auto-creation races the owners and produces wrong partition counts
      # (observed: a consumer subscription auto-created a 1-partition topic).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  stammdaten-db:                      # Stammdaten-Speicher (PostgreSQL)
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: heating_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - stammdaten-data:/var/lib/postgresql/data

  measurement-db:                     # Messwertspeicher (TimescaleDB)
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: heating_platform_measurements
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - measurement-data:/var/lib/postgresql/data
      - ./measurement-db/init:/docker-entrypoint-initdb.d:ro

volumes:
  stammdaten-data:
  measurement-data:
